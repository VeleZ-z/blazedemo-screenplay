buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("net.serenity-bdd:serenity-gradle-plugin:3.3.4")
    }
}

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
}

group 'com.blazedemo'
version '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '3.3.4'
    serenityCucumberVersion = '3.3.4'
    serenityWebVersion = '3.3.4'
    junit = '4.13.2'
    hamcrest = '1.3'
    lombokVersion = '1.18.30'
    webDriverManagerVersion = '5.4.1'
    slf4jVersion = '2.0.5'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:$serenityVersion"
    implementation "net.serenity-bdd:serenity-junit:$serenityVersion"
    implementation "net.serenity-bdd:serenity-screenplay:$serenityVersion"
    implementation "net.serenity-bdd:serenity-cucumber:$serenityCucumberVersion"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:$serenityWebVersion"
    implementation "org.slf4j:slf4j-simple:$slf4jVersion"

    testImplementation "junit:junit:$junit"
    testImplementation "org.hamcrest:hamcrest-all:$hamcrest"
    testImplementation "io.github.bonigarcia:webdrivermanager:$webDriverManagerVersion"
    testImplementation "org.slf4j:slf4j-simple:$slf4jVersion"

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testCompileOnly "org.projectlombok:lombok:$lombokVersion"

    implementation "org.apache.commons:commons-dbcp2:2.12.0"
}

test {
    outputs.upToDateWhen { false }
    systemProperty 'demo.delay.ms', System.getProperty('demo.delay.ms', '0')
    systemProperty 'headless.mode', System.getProperty('headless.mode', 'false')
    exclude '**/SmokeRunner*'
    finalizedBy 'aggregate'
}

task smokeTest(type: Test) {
    description = 'Runs smoke tests for presentation demo'
    group = 'verification'
    outputs.upToDateWhen { false }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/SmokeRunner*'
    systemProperty 'demo.delay.ms', System.getProperty('demo.delay.ms', '0')
    systemProperty 'headless.mode', System.getProperty('headless.mode', 'false')
    finalizedBy 'aggregate'
}

apply plugin: 'net.serenity-bdd.serenity-gradle-plugin'