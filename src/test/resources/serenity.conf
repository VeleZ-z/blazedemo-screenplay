serenity {
    take.screenshots = FOR_FAILURES
    use.unique.browser = true
    test.root = com.blazedemo.screenplay
    console.colors = true
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
    timeout = 30000
    wait.for.timeout = 30000
}

webdriver {
    driver = chrome
    autodownload = true
    timeouts {
        implicit = 10000
        pageLoad = 30000
        script = 30000
    }
    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
            args = ["--start-maximized", "--test-type", "--no-sandbox", "--ignore-certificate-errors",
                    "--disable-popup-blocking", "--disable-default-apps", "--disable-extensions-file-access-check",
                    "--incognito", "--disable-infobars", "--disable-gpu", "--remote-allow-origins=*",
                    "--disable-blink-features=AutomationControlled"]
        }
    }
}

pages {
    blazedemoUrl = "https://blazedemo.com/"
}