serenity {
    take.screenshots = FOR_FAILURES
    use.unique.browser = true
    test.root = com.blazedemo.screenplay
    console.colors = true
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

# Headless mode is controlled via system property 'headless.mode' passed from Gradle
# When headless.mode=true, Serenity will run in headless mode
webdriver {
    driver = chrome
    autodownload = true
    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
    }
}

chrome.switches = """--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;
                   --disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;
                   --incognito;--disable-infobars;--disable-gpu;--remote-allow-origins=*"""

pages {
    blazedemoUrl = "https://blazedemo.com/"
}